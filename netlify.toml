# Publicação no Netlify (site estático gerado pelo Vite).
# O Netlify lê este arquivo e preenche sozinho as configurações de build.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # O Vite 7 exige Node 20.19 ou mais novo.
  NODE_VERSION = "22"
  # Instala também as dependências de desenvolvimento (TypeScript e Vite são usados no build).
  NPM_FLAGS = "--include=dev"
  # Login e nuvem (Supabase): também estão em .env.production (usado por qualquer
  # hospedagem). Estas duas chaves são públicas por natureza (vão
  # para o navegador de qualquer forma); quem protege os dados são as regras
  # de segurança do banco. NUNCA coloque aqui a chave service_role.
  # Sem elas, o jogo funciona só como visitante e o botão "Entrar" não aparece.
  VITE_SUPABASE_URL = "https://ejhautygiirevtgobyor.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_m-ABaKlyGsWa_NQ88wE03A_or8t07si"

# As telas do jogo usam "#" (ex.: /#clubes), então o site só tem a página "/".
# Qualquer outro endereço digitado volta para o início, em vez de dar erro 404.
# Arquivos que existem (index.html, /assets/...) são servidos normalmente.
# O jogo mudou para https://11brl.com.br (Cloudflare). Quem abrir o endereço
# antigo do Netlify é levado para o novo (o "#" da tela é mantido pelo navegador).
[[redirects]]
  from = "/*"
  to = "https://11brl.com.br/:splat"
  status = 301
  force = true

# Cabeçalhos de cache e segurança: em public/_headers (o mesmo arquivo serve
# para o Netlify e para o Cloudflare Pages).
