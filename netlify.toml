# Publicação no Netlify (site estático gerado pelo Vite).
# O Netlify lê este arquivo e preenche sozinho as configurações de build.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # O Vite 7 exige Node 20.19 ou mais novo.
  NODE_VERSION = "22"
  # Instala também as dependências de desenvolvimento (TypeScript e Vite são usados no build).
  NPM_FLAGS = "--include=dev"
  # Login e nuvem (Supabase). Estas duas chaves são públicas por natureza (vão
  # para o navegador de qualquer forma); quem protege os dados são as regras
  # de segurança do banco. NUNCA coloque aqui a chave service_role.
  # Sem elas, o jogo funciona só como visitante e o botão "Entrar" não aparece.
  # VITE_SUPABASE_URL = "https://SEU-PROJETO.supabase.co"
  # VITE_SUPABASE_ANON_KEY = "SUA-CHAVE-ANON-OU-PUBLISHABLE"

# As telas do jogo usam "#" (ex.: /#clubes), então o site só tem a página "/".
# Qualquer outro endereço digitado volta para o início, em vez de dar erro 404.
# Arquivos que existem (index.html, /assets/...) são servidos normalmente.
[[redirects]]
  from = "/*"
  to = "/"
  status = 302

# Arquivos gerados com hash no nome (JS, CSS, fontes, imagens): podem ficar em
# cache no navegador por muito tempo, porque cada versão nova tem outro nome.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
